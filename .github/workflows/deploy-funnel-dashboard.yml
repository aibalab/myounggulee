name: Deploy funnel dashboard

on:
  push:
    branches:
      - gh-pages
    paths:
      - .github/workflows/deploy-funnel-dashboard.yml
      - dashboard-deploy-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Fetch dashboard HTML
        run: |
          mkdir -p dashboard
          curl -fsSL "https://adventure-approach-direct-roland.trycloudflare.com/dashboard/" -o dashboard/index.html
          test -s dashboard/index.html
          grep -q "Funnel Hypothesis Studio" dashboard/index.html
      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html
          if git diff --cached --quiet; then
            echo "No dashboard changes"
          else
            git commit -m "Deploy funnel hypothesis dashboard"
            git push origin gh-pages
          fi
